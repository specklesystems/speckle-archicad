version: 2
updates:
  # Pin updates of the shared workflows in specklesystems/.github, in one pull
  # request per new tag there, after the cooldown that only speckle-next skips.
  # Dependabot security updates are on in this repo, so the entry has no
  # `allow`, which would stop them for the other actions; those get their own
  # group (ADR-0002 amendment of 2026-11-24).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    groups:
      dot-github:
        patterns:
          - specklesystems/.github/*
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7
