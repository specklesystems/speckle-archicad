# separate terms of service, privacy policy, and support
# documentation.

name: Build and Deploy Archicad

on:
  push:
    branches: ["installer-test/**"]
    tags: ["202[0-9].*.*"] # unprefixed CalVer, v-prefix dropped at 2026.9 (ENG-9392)

jobs:
  build-windows:
    runs-on: windows-latest
    outputs:
      semver: ${{ steps.set-version.outputs.semver }}
      fileVersion: ${{ steps.set-version.outputs.fileVersion }}

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v3

      - id: set-version
        name: Set version to output
        shell: bash
        run: |
          TAG=${{ github.ref_name }}
          if [[ "${{ github.ref }}" != refs/tags/* ]]; then
            TAG="v0.0.0.${{ github.run_number }}"
          fi
          SEMVER="${TAG#v}"
          FILE_VERSION=$(echo "$TAG" | sed -E 's/^v?([0-9]+\.[0-9]+\.[0-9]+).*/\1/')
          FILE_VERSION="$FILE_VERSION.${{ github.run_number }}"

          echo "semver=$SEMVER" >> "$GITHUB_OUTPUT"
          echo "fileVersion=$FILE_VERSION" >> "$GITHUB_OUTPUT"

          echo $SEMVER
          echo $FILE_VERSION

      - name: Build
        run: ./build.ps1
        env:
          # ci-build/Program.cs reads these from the environment; step outputs
          # alone are not visible to it.
          SEMVER: ${{ steps.set-version.outputs.semver }}
          FILE_VERSION: ${{ steps.set-version.outputs.fileVersion }}

      - uses: actions/upload-artifact@v7
        with:
          name: output-${{ steps.set-version.outputs.semver }}
          path: output/*.zip
          retention-days: 1
          if-no-files-found: error

  deploy-installers:
    runs-on: ubuntu-latest
    needs: build-windows
    env:
      IS_PUBLIC_RELEASE: ${{ github.ref_type == 'tag' }}
    steps:
      - name: 🔫 Trigger Build Installer(s)
        uses: benc-uk/workflow-dispatch@v1.3.2
        with:
          workflow: Build Installers
          repo: specklesystems/connector-installers
          token: ${{ secrets.CONNECTORS_GH_TOKEN }}
          inputs: '{
            "run_id": "${{ github.run_id }}",
            "semver": "${{ needs.build-windows.outputs.semver }}",
            "file_version": "${{needs.build-windows.outputs.fileVersion}}",
            "repo": "${{ github.repository }}",
            "is_public_release": ${{ env.IS_PUBLIC_RELEASE }}
            }'
          ref: main
          wait-for-completion: true
          sync-status: true
        timeout-minutes: 15

      - uses: geekyeggo/delete-artifact@v6
        with:
          name: output-*
