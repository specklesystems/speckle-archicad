# Minimum colors for the risk check (risk-check/ in specklesystems/.github). A
# changed file that matches a path here gets at least that color, plus one
# comment that someone answers like an approver finding. Paths match from the
# repo root: "*" stays inside one directory, "**" spans any number of them.
# Everything under .github/ is red whatever this file says. A pull request that
# leaves this file unreadable fails the risk check.
yellow:
  # Agent configuration
  - '**/AGENTS.md'
  - '**/CLAUDE.md'
  - agents/**
  - '**/.agents/**'
  - '**/.claude/**'
  - '**/.codex/**'
  - '**/.omp/**'
  # Authentication and secrets code: the OAuth flow, where accounts and their
  # tokens are stored and handed to the UI, and the HTTP client that sends them
  - AddOns/Speckle/Sources/AddOn/Auth/**
  - AddOns/Speckle/Sources/AddOn/Connector/AccountDatabase.*
  - AddOns/Speckle/Sources/AddOn/Connector/IAccountDatabase.h
  - AddOns/Speckle/Sources/AddOn/Connector/Bridges/AccountBridge.*
  - AddOns/Speckle/Sources/AddOn/Network/WinHttpClient.*
  # Betterleaks exceptions
  - '**/.betterleaks.toml'
  - '**/.betterleaksignore'
  - '**/.gitleaksignore'
  # Release: the build that makes the installer zip, which goes to the
  # installer feed
  - ci-build/**
  - build.ps1
  - .config/dotnet-tools.json
red:
  - .github/**
# Machine accounts with write access: their color reviews and approvals never count.
bots:
  - SpeckleDevBot
